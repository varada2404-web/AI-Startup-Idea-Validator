name: Python checks

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install check tools
        run: python -m pip install pytest ruff
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest
        run: |
          if find backend/tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest
          else
            echo "No test modules are present yet; pytest is skipped."
          fi
