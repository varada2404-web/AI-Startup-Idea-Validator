name: Python checks

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install app and check dependencies
        run: >-
          python -m pip install "fastapi>=0.115,<1" "google-genai>=2.30,<3" "httpx>=0.27,<1"
          "pydantic>=2,<3" "pytest>=8,<10" "pytest-asyncio>=0.23,<1" "ruff>=0.11,<1" "uvicorn>=0.32,<1"
      - name: Ruff
        run: python -m ruff check .
      - name: Pytest
        run: |
          if find backend/tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest
          else
            echo "No test modules are present yet; pytest is skipped."
          fi
