[project]
name = "ai-startup-idea-validator"
version = "0.1.0"
description = "Evidence-first startup idea validation project"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "google-genai>=2.30,<3",
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "backend/app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
