[project]
name = "ai-startup-idea-validator"
version = "0.1.0"
description = "Evidence-first startup idea validation project"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["backend", "backend/app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"
